# ===========================================
# Fast_Swarm - Code Quality Configuration
# ===========================================

[project]
name = "Fast_Swarm"
version = "0.1.0"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ===========================================
# RUFF Configuration
# ===========================================
[tool.ruff]
target-version = "py312"
line-length = 120

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "tmpclaude-*",
    ".hypothesis",
]

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

# Ignore these specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in FastAPI)
    "B904",   # raise without from (too noisy)
    "SIM108", # ternary operator (readability preference)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have more relaxed rules
"Tests/**/*.py" = ["B011", "SIM"]
"**/test_*.py" = ["B011", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ===========================================
# PYRIGHT Configuration
# ===========================================
[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"

# Type checking mode: off, basic, standard, strict, all
typeCheckingMode = "basic"  # Start with basic, upgrade to strict later

# Include/exclude
include = ["."]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "tmpclaude-*",
    ".hypothesis",
    "local_agents",  # Legacy code, exclude initially
]

# Report settings (for basic mode)
reportMissingImports = true
reportMissingTypeStubs = false  # Don't require stubs for all packages
reportUnusedImport = true
reportUnusedVariable = true

# ===========================================
# BANDIT Configuration
# ===========================================
[tool.bandit]
exclude_dirs = [".git", "venv", ".venv", "tmpclaude-*", ".hypothesis", "Tests"]
skips = [
    "B101",  # assert_used - we use assert in tests
    "B104",  # hardcoded_bind_all_interfaces - dev server binds 0.0.0.0
    "B311",  # random - we intentionally use random for chaos/evolution
]

# ===========================================
# PYTEST Configuration (bonus)
# ===========================================
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "mutmut>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ===========================================
# COVERAGE Configuration
# ===========================================
[tool.coverage.run]
source = ["Fast_Swarm"]
branch = true
omit = [
    "*/Tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/scripts/*",
    "*/local_agents/*",
]

[tool.coverage.paths]
source = [
    "src/Fast_Swarm/",
    "*/Fast_Swarm/",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "pass",
    "@abstractmethod",
]

# ===========================================
# MUTMUT Configuration
# ===========================================
[tool.mutmut]
paths_to_mutate = [
    "src/Fast_Swarm/Trading/Services/",
    "src/Fast_Swarm/Agents/Services/fitness_service.py",
    "src/Fast_Swarm/Agents/Services/evolution_service.py",
    "src/Fast_Swarm/Agents/Services/spawn_service.py",
    "src/Fast_Swarm/local_agents/backtest/cross_pairs.py",
    "src/Fast_Swarm/local_agents/backtest/pattern_matcher.py",
    "src/Fast_Swarm/utilities/pattern_priority.py",
    "src/Fast_Swarm/System/Services/evolution_cycle_service.py",
]
tests_dir = "src/Fast_Swarm/Tests/"
runner = "python -m pytest -x --timeout=10"
